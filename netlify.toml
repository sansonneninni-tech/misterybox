# Configurazione Netlify.
# Collegando il repository dall'interfaccia di Netlify non serve impostare
# nulla a mano: build, cartella da pubblicare e intestazioni sono qui.

[build]
  command = "npm run build:page"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Il gioco non ha dipendenze a runtime, ma la build usa TypeScript e Vite.
  NPM_FLAGS = "--include=dev"

# I file in assets/ hanno il contenuto nel nome: si possono tenere in cache
# per sempre, tanto a ogni build cambia il nome.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le pagine invece vanno sempre riconvalidate, così un nuovo deploy si vede
# subito senza svuotare la cache del browser.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/verdania.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Il gioco non contatta nessun server: la policy lo mette nero su bianco.
# Gli stili e gli script sono incorporati nella pagina, quindi serve
# 'unsafe-inline'; nessuna connessione in uscita e' consentita.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors *"
