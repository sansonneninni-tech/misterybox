# Versione di prova online di ATELIER (tutto nel browser, Higgsfield simulato).
# Su Netlify: cartella base "atelier".
[build]
  command = "node tools/build-web.mjs"
  publish = "dist-web"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
