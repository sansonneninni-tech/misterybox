<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Verdania</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%; width: 100%;
        background: #05070d; overflow: hidden;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: #cfd7e6;
        -webkit-tap-highlight-color: transparent;
        touch-action: none; overscroll-behavior: none;
      }
      #app {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        padding-bottom: 0; transition: padding-bottom .2s;
        background:
          radial-gradient(circle at 50% 35%, #16203a 0%, #080b14 60%, #05070d 100%);
      }
      canvas#screen {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        box-shadow: 0 0 0 2px #1d2740, 0 0 0 6px #0d1220, 0 18px 60px rgba(0,0,0,.75);
        border-radius: 2px;
        background: #000;
      }
      @media (orientation: portrait) { html.touch #app { padding-bottom: 190px; } }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: #05070d; z-index: 30; text-align: center; padding: 20px;
      }
      #boot h1 { font-size: 20px; letter-spacing: 4px; margin: 0; color: #7fd6a5; }
      #boot p { font-size: 12px; margin: 0; color: #7b87a3; line-height: 1.7; }
      #boot button {
        margin-top: 8px; padding: 12px 26px; font: inherit; font-size: 13px;
        letter-spacing: 2px; cursor: pointer; color: #05070d; background: #7fd6a5;
        border: 0; border-radius: 3px;
      }
      #boot button:active { transform: translateY(1px); }
      #fatal {
        position: fixed; inset: 0; z-index: 50; display: none; padding: 24px;
        background: #1a0d10; color: #ffb4b4; font-size: 12px; overflow: auto;
        white-space: pre-wrap; line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="screen"></canvas></div>
    <div id="boot">
      <h1>VERDANIA</h1>
      <p>
        Frecce / WASD: muovi &nbsp;·&nbsp; Z o Invio: conferma &nbsp;·&nbsp; X: annulla<br />
        C: menu &nbsp;·&nbsp; M: musica on/off &nbsp;·&nbsp; F: schermo intero<br />
        Su mobile: usa i comandi a schermo
      </p>
      <button id="boot-start" type="button">INIZIA</button>
    </div>
    <pre id="fatal"></pre>
    <script>
      // Riserva spazio ai comandi a schermo prima che il motore calcoli la scala.
      (function () {
        function reserve() {
          var touch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
          var portrait = window.innerHeight > window.innerWidth;
          document.documentElement.dataset.uiReserved = touch && portrait ? '190' : '0';
        }
        reserve();
        window.addEventListener('resize', reserve);
        window.addEventListener('orientationchange', reserve);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
