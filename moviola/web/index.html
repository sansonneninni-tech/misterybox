<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moviola">
  <title>MOVIOLA</title>
  <meta name="description" content="Laboratorio locale di video astratti sperimentali.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="/design/tokens.css">
  <link rel="stylesheet" href="/design/components.css">
  <link rel="stylesheet" href="/design/moviola.css">
</head>
<body>
  <div class="shell" id="shell" data-side="closed">
    <header class="bar">
      <div class="logo">Moviola</div>
      <nav class="nav" id="nav" aria-label="Sezioni">
        <button class="nav__item" data-go="archivio"><span class="nav__num">01</span>Archivio</button>
        <button class="nav__item" data-go="banco"><span class="nav__num">02</span>Banco</button>
        <button class="nav__item" data-go="laboratorio"><span class="nav__num">03</span>Laboratorio</button>
        <button class="nav__item" data-go="vivo"><span class="nav__num">04</span>Dal vivo</button>
        <button class="nav__item" data-go="esporta"><span class="nav__num">05</span>Esporta</button>
      </nav>
      <div class="bar__end">
        <span class="engine" id="engine" title="Motori"></span>
        <button class="link" id="sideBtn" title="Interlocutore (I)">Interlocutore</button>
      </div>
    </header>
    <main class="main" id="main"></main>
    <button class="side-scrim" data-act="side-close" aria-label="Chiudi il pannello"></button>
    <aside class="side" id="side" aria-label="Interlocutore"></aside>
    <footer class="status" id="status"></footer>
  </div>
  <div id="layer"></div>
  <noscript>MOVIOLA ha bisogno di JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
