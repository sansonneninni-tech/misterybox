<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moviola">
  <title>MOVIOLA</title>
  <meta name="description" content="Laboratorio locale di video astratti sperimentali.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="/design/tokens.css">
  <link rel="stylesheet" href="/design/components.css">
  <link rel="stylesheet" href="/design/moviola.css">
  <link rel="stylesheet" href="/design/territorio.css">
  <link rel="stylesheet" href="/design/corpo.css">
  <link rel="stylesheet" href="/design/organismo.css">
  <link rel="stylesheet" href="/design/ricette-deriva.css">
</head>
<body>
  <div class="shell" id="shell" data-side="closed">
    <header class="bar">
      <div class="logo">Moviola</div>
      <button class="steps__back only-phone" id="back" aria-label="Indietro">‹</button>
      <nav class="steps" id="nav" aria-label="Passi">
        <button class="steps__item" data-go="scegli"><span class="steps__n">1</span>Scegli</button>
        <button class="steps__item" data-go="trasforma"><span class="steps__n">2</span>Trasforma</button>
        <button class="steps__item" data-go="salva"><span class="steps__n">3</span>Salva</button>
      </nav>
      <span class="steps__phone only-phone" id="stepPhone"></span>
      <div class="bar__end">
        <span class="engine only-desk" id="engine" title="Motori"></span>
        <button class="bar__reset" id="resetBtn" hidden title="Riporta le foto com’erano quando le hai scelte. Puoi annullare subito dopo.">Reset</button>
        <button class="link" id="advBtn" aria-haspopup="dialog">Avanzato</button>
      </div>
    </header>
    <main class="main" id="main"></main>
    <button class="side-scrim" data-act="side-close" aria-label="Chiudi il pannello"></button>
    <aside class="side" id="side" aria-label="Interlocutore"></aside>
    <footer class="status" id="status"></footer>
  </div>
  <div id="layer"></div>
  <noscript>MOVIOLA ha bisogno di JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
