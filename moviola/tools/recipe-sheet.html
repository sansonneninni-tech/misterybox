<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script type="module">
import { Renderer } from '../web/engine/renderer.js';
import { RECIPES } from '../web/engine/recipes.js';
import { defaultClip, normalizeClip } from '../web/engine/clip.js';
const W = 384, H = 216;
const r = new Renderer(document.getElementById('c'));
r.setSize(W, H);
const sc = document.createElement('canvas'); sc.width = 480; sc.height = 270;
const g = sc.getContext('2d');
function drawSrc(t) { // sorgente "video" sintetica: figura che cammina, luce che passa
  g.fillStyle = '#3a342c'; g.fillRect(0,0,480,270);
  g.fillStyle = '#d8cbb4'; g.fillRect(((t*90)%560)-80, 40, 50, 190);
  g.fillStyle = '#111'; g.beginPath(); g.arc(240 + Math.sin(t*1.3)*120, 135 + Math.cos(t*0.9)*50, 46, 0, 7); g.fill();
}
const out = [];
const only = new URLSearchParams(location.search).get('r');
for (const rec of RECIPES) {
  if (only && rec.id !== only) continue;
  const m = rec.make();
  const clip = normalizeClip({ ...defaultClip(), ...m, format: { ...defaultClip().format, ...(m.format||{}), duration: 6 }, seed: 11 });
  r.setSources(rec.needs === 'niente' ? [] : [{ el: sc, w: 480, h: 270, kind: 'video' }]);
  r.prune([]); r.reset();
  const fps = clip.format.fps, N = 6 * fps, picks = [0, 1, 2, 3, 4, 5].map(i => Math.floor(i * N / 6) + 12);
  const imgs = [];
  for (let f = 0; f <= picks[picks.length-1]; f++) {
    drawSrc(f / fps);
    r.render(clip, (f % N) / fps, f, null, { display: picks.includes(f) });
    if (picks.includes(f)) imgs.push(r.canvas.toDataURL('image/jpeg', 0.9));
  }
  out.push({ id: rec.id, imgs, err: [...r.errors.entries()] });
}
window.__out = out;
</script>
