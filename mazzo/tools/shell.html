<title>MAZZO</title>

<style>
  /*
    Il gioco vive dentro una piccola console appoggiata al buio. Un solo tema:
    la pagina dipinge sempre il proprio fondo, così regge su qualunque sfondo.
  */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 38%, #241d15 0%, #120e0a 62%, #0b0906 100%), #0b0906;
    color: #cdbfa6;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px;
  }

  canvas#screen {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    box-shadow: 0 0 0 2px #2a2118, 0 0 0 6px #14100b, 0 18px 60px rgba(0, 0, 0, .75);
    border-radius: 2px;
    background: #000;
  }

  .hint {
    margin: 0;
    font-size: 11px;
    letter-spacing: 1px;
    color: #7d6f5c;
    text-align: center;
    line-height: 1.8;
  }

  @media (orientation: portrait) {
    html.touch #app { padding-bottom: 190px; }
    html.touch .hint { display: none; }
  }

  #fatal {
    position: fixed; inset: 0; z-index: 50; display: none; padding: 24px;
    background: #1a0d10; color: #ffb4b4; font-size: 12px; overflow: auto;
    white-space: pre-wrap; line-height: 1.6;
  }
</style>

<div id="app">
  <canvas id="screen"></canvas>
  <p class="hint">WASD o frecce: muoviti &nbsp;·&nbsp; E o Spazio: interagisci &nbsp;·&nbsp; M: audio</p>
</div>
<pre id="fatal"></pre>

<script>
  (function () {
    function reserve() {
      var touch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      var portrait = window.innerHeight > window.innerWidth;
      document.documentElement.dataset.uiReserved = touch && portrait ? '190' : '46';
    }
    reserve();
    window.addEventListener('resize', reserve);
    window.addEventListener('orientationchange', reserve);
    window.addEventListener('error', function (e) {
      var box = document.getElementById('fatal');
      if (!box) return;
      box.style.display = 'block';
      box.textContent = 'Errore: ' + (e.message || e);
    });
  })();
</script>

</script>
